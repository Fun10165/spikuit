[project]
name = "spikuit-tutor"
version = "0.7.1"
description = "Tutor application for Spikuit — FSRS-scheduled review, quiz rendering, and exam planning"
requires-python = ">=3.11"
dependencies = [
    "spikuit-core[engine]",
    "textual>=0.80.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spikuit_tutor"]
