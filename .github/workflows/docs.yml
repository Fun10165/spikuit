name: Deploy Docs

# Branch-based Pages (mkdocs gh-deploy -> gh-pages branch), not the
# Actions-artifact-based Deployments API. The latter (actions/deploy-pages)
# repeatedly got stuck in "deployment_queued" for its full 10-minute
# timeout on this repo — GitHub-side backend flakiness, confirmed
# independent of this workflow's own config. Branch-based Pages has no
# comparable async deployment queue: a push to gh-pages is just served as
# static files. Repo Pages source is set to "Deploy from a branch: gh-pages".
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "llms.txt"
      - "**/*.py"
  workflow_dispatch:

permissions:
  contents: write # mkdocs gh-deploy pushes to the gh-pages branch

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build and deploy docs
        run: uv run mkdocs gh-deploy --force --clean
