name: Deploy Docs

# Auto-deploy-on-push is PAUSED (see the comment further down) — GitHub
# Pages' own deployment backend has been getting stuck in
# "deployment_queued" for the full 10-minute actions/deploy-pages
# timeout on this repo, independent of our workflow config (confirmed:
# our concurrency/path-filter fixes work as intended, cancelling
# superseded runs correctly, but the one deployment left standing each
# time still hangs server-side). Re-enable the `push:` trigger below
# once that's settled; until then, deploy manually:
#   gh workflow run "Deploy Docs" --repo takyone/spikuit
on:
  # push:
  #   branches: [main]
  #   paths:
  #     - "docs/**"
  #     - "mkdocs.yml"
  #     - "README.md"
  #     - "llms.txt"
  #     - "**/*.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --dev

      - name: Build docs
        run: uv run mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
